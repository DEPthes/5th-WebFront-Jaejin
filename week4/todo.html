<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>오늘의 할 일</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f0ece4;
      font-family: 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
    }

    /* 외부 컨테이너 - 코랄 그라데이션 */
    .outer {
      background: linear-gradient(145deg, #e8a87c, #d4785a);
      border-radius: 24px;
      padding: 24px;
      width: 380px;
      box-shadow: 0 12px 40px rgba(212, 120, 90, 0.35);
    }

    /* 내부 흰색 카드 */
    .card {
      background: #fff;
      border-radius: 16px;
      padding: 28px 24px 20px;
    }

    /* 제목 */
    .card h1 {
      text-align: center;
      font-size: 1.3rem;
      font-weight: 700;
      color: #333;
      margin-bottom: 20px;
      letter-spacing: -0.3px;
    }

    /* 입력 영역 */
    .input-row {
      display: flex;
      gap: 10px;
      margin-bottom: 18px;
    }

    .input-row input {
      flex: 1;
      border: 1.5px solid #e0dbd5;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 0.92rem;
      color: #333;
      outline: none;
      transition: border-color 0.2s;
      font-family: inherit;
    }

    .input-row input::placeholder {
      color: #bbb;
    }

    .input-row input:focus {
      border-color: #e08060;
    }

    .btn-add {
      background: linear-gradient(135deg, #e8956d, #d4785a);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 10px 18px;
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: opacity 0.2s, transform 0.1s;
      white-space: nowrap;
    }

    .btn-add:hover  { opacity: 0.88; }
    .btn-add:active { transform: scale(0.96); }

    /* 할 일 목록 */
    .todo-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-height: 20px;
    }

    /* 개별 할 일 항목 */
    .todo-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 4px;
      border-bottom: 1px solid #f5f0ec;
      animation: fadeIn 0.2s ease;
    }

    .todo-item:last-child {
      border-bottom: none;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* 체크 버튼 (원형) */
    .btn-check {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 2px solid #d0c8c0;
      background: transparent;
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.2s;
      position: relative;
    }

    .btn-check.checked {
      background: #e08060;
      border-color: #e08060;
    }

    .btn-check.checked::after {
      content: '';
      position: absolute;
      top: 4px;
      left: 3px;
      width: 10px;
      height: 6px;
      border-left: 2px solid #fff;
      border-bottom: 2px solid #fff;
      transform: rotate(-45deg);
    }

    /* 할 일 텍스트 */
    .todo-text {
      flex: 1;
      font-size: 0.93rem;
      color: #444;
      transition: all 0.2s;
    }

    .todo-text.done {
      text-decoration: line-through;
      color: #bbb;
    }

    /* 삭제 버튼 */
    .btn-delete {
      background: transparent;
      border: none;
      color: #ccc;
      font-size: 1rem;
      cursor: pointer;
      padding: 2px 4px;
      line-height: 1;
      border-radius: 4px;
      transition: color 0.2s;
      flex-shrink: 0;
    }

    .btn-delete:hover { color: #e05555; }

    /* 빈 목록 안내 */
    .empty-msg {
      text-align: center;
      color: #ccc;
      font-size: 0.85rem;
      padding: 16px 0 8px;
    }

    /* 하단 카운터 */
    .counter {
      margin-top: 14px;
      font-size: 0.82rem;
      color: #aaa;
      text-align: left;
    }
  </style>
</head>
<body>

  <div class="outer">
    <div class="card">
      <h1>오늘의 할 일</h1>

      <!-- 입력 영역 -->
      <div class="input-row">
        <input type="text" id="todo-input" placeholder="할 일을 입력하세요">
        <button class="btn-add" id="btn-add">추가</button>
      </div>

      <!-- 할 일 목록 -->
      <ul class="todo-list" id="todo-list"></ul>

      <!-- 남은 항목 카운터 -->
      <p class="counter" id="counter"></p>
    </div>
  </div>

  <script src="todo.js"></script>

</body>
</html>
